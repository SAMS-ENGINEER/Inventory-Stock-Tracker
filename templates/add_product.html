<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Item | Inventory Stock Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="app-layout">

        <!-- SAME SIDEBAR -->
        {% include 'sidebar.html' %}

        <main class="main-content">

            <div class="topbar">
                <div class="page-heading">
                    <h1>Add Item</h1>
                    <p>Add new products to your warehouse inventory</p>
                </div>

                <div class="topbar-right">
                    <div class="profile">
                        <span class="avatar">A</span>
                        <span>Admin</span>
                    </div>
                </div>
            </div>

            <section class="panel add-product-panel">

                <div class="panel-heading">
                    <div>
                        <h3>
                            <i class="fa-solid fa-circle-plus heading-bolt"></i>
                            Add New Product
                        </h3>
                        <p>Enter the product details below</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('add_product') }}" class="add-product-form">

                    <div class="form-group">
                        <label for="name">Product Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter product name" required>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="aisle">Aisle</label>
                            <input type="text" id="aisle" name="aisle" placeholder="e.g. A1" required>
                        </div>

                        <div class="form-group">
                            <label for="bin">Bin</label>
                            <input type="text" id="bin" name="bin" placeholder="e.g. B2" required>
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" name="quantity" placeholder="Enter quantity" min="0"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="minimum">Minimum Stock</label>
                            <input type="number" id="minimum" name="minimum" placeholder="Minimum quantity" min="0"
                                required>
                        </div>

                    </div>

                    <div class="form-actions">

                        <button type="submit" class="submit-btn">
                            <i class="fa-solid fa-plus"></i>
                            Add Product
                        </button>

                        <a href="{{ url_for('inventory') }}" class="cancel-btn">
                            Cancel
                        </a>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
